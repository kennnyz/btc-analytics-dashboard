<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTC Analytics Dashboard</title>
    <script>
      // Apply the saved theme before first paint; ThemeContext does the same after React loads.
      document.documentElement.setAttribute('data-theme', localStorage.getItem('btc-dash-theme') === 'dark' ? 'dark' : 'light');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
